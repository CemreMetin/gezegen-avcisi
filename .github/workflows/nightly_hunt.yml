name: Nightly TESS Hunter

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.10 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-worker.txt

      - name: Worker Bagimliliklarini Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt

      - name: Gece Taramasini Calistir
        run: |
          python -m pipeline.worker

      - name: Degisiklikleri Commit Et
        run: |
          git config --global user.name "TESS Hunter Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/cursor.txt data/*.csv pending_candidates/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: nightly batch update [skip ci]" && git push)
